<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Wiki · 条目检索</title>
<link rel="stylesheet" href="search.css">
</head>
<body>
<header class="top">
  <h1>Research Wiki · 条目检索</h1>
  <p class="meta" id="meta">加载索引…</p>
</header>
<div class="layout">
  <aside class="facets" aria-label="分面筛选">
    <label class="kind">类型
      <select id="kind"><option value="">全部</option></select>
    </label>
    <section data-facet="charts"><h2>图型</h2><div class="chips"></div></section>
    <section data-facet="domains"><h2>领域 <small>受控词表</small></h2><div class="chips"></div></section>
    <section data-facet="packages"><h2>R 包</h2>
      <input class="facet-filter" type="search" placeholder="筛选 R 包名…" aria-label="筛选 R 包名">
      <div class="chips"></div>
    </section>
    <button id="reset" type="button">清空筛选</button>
  </aside>
  <main>
    <input id="q" type="search" placeholder="关键词：标题、摘要、ID、关键词、包名、领域…" aria-label="关键词搜索" autofocus>
    <p class="count" id="count"></p>
    <ol class="results" id="results"></ol>
  </main>
</div>
<script type="module" src="search.js"></script>
</body>
</html>
