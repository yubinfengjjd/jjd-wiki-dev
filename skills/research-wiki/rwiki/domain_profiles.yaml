# 跨领域证据/前提配置（specification fixture，schema_version: 1）
#
# 这是结构化规格夹具，不是“各领域当前可用方法表”：method_refs/figure_refs
# 只是指向规范 Wiki id 的引用线索，由调用方对照实际页面与收据解析；解析不到
# 就报告缺口，不复制可用性结论。前提满足仅代表材料证据成立，不授予算法验证。
schema_version: 1
profiles:
  bioinformatics_single_cell:
    version: 1
    domain: 生物信息学
    label: 单细胞转录组
    entity_kinds: [subject, sample, cell]
    object_kinds: [object, matrix, table]
    context_fields: [organism, id_system, assay, transform, sample_design, analysis_unit]
    prerequisites:
      - id: expression_object
        description: 已注册表达对象/矩阵（原生对象即可，不要求转 CSV）
        type: object
        match: {kind: [object, matrix], properties: {assay: [expression, counts, normalized]}}
      - id: design
        description: 分组/设计定义（供体-样本-细胞层级按分支需要单独声明）
        type: observation
        match: {claim: [design_defined, grouping_defined]}
      - id: context_keys
        description: 对象携带物种与标识体系上下文
        type: object
        match: {kind: [object, matrix], properties: {assay: [expression, counts, normalized]}}
        require_properties: [organism, id_system]
      - id: donor_level
        description: 供体/样本层级已知（推断类分析的必要前提）
        type: observation
        match: {claim: [donor_level_known, pseudoreplication_ruled]}
    stage_evidence: [qc, filtering, normalization, integration, clustering, annotation, marker_detection]
    result_checks: [scope_descriptive_vs_inference, donor_level_variance, batch_confounds]
    method_refs: [cell-quality-control, gene-set-scoring]
    figure_refs: []
    knowledge_gaps: [细胞注释正确性不由对象列存在授予；癌症/轨迹/通讯路线按数据前提逐项审查，不设必跑链]

  bioinformatics_bulk_omics:
    version: 1
    domain: 生物信息学
    label: bulk 转录组及其他组学
    entity_kinds: [subject, sample]
    object_kinds: [matrix, table]
    context_fields: [organism, id_system, assay, transform, sample_design, batch]
    prerequisites:
      - id: abundance_matrix
        description: 已注册定量矩阵（表达/丰度/计数）
        type: object
        match: {kind: matrix, properties: {assay: [expression, abundance, counts]}}
      - id: samples
        description: 样本实体已登记
        type: entity
        match: {kind: sample}
      - id: design
        description: 分组/对照与批次设计已说明
        type: observation
        match: {claim: [design_defined, grouping_defined, batch_recorded]}
      - id: id_system
        description: 标识体系与版本已记录
        type: observation
        match: {claim: [id_system_recorded, annotation_version_recorded]}
    stage_evidence: [qc, normalization, differential, enrichment]
    result_checks: [per_sample_inference_scope, multiple_testing, id_mapping_version]
    method_refs: []
    figure_refs: []
    knowledge_gaps: [bulk 推断与单细胞反卷积分别核查单位；矩阵存在不证明标准化/批次处理已做]

  deep_learning:
    version: 1
    domain: 深度学习
    label: 机器学习/深度学习任务（训练、推理、评价、解释之一）
    entity_kinds: [subject, sample, image, roi]
    object_kinds: [dataset, table, image_set, matrix, model, weights]
    context_fields: [task_type, split, preprocessing, feature_definition, model_source]
    prerequisites:
      - id: dataset
        description: 已注册数据集或预测/评价对象
        type: object
        match: {kind: [dataset, table, image_set, matrix], properties: {role: [dataset, predictions, evaluation]}}
      - id: split_defined
        description: 数据划分/泄漏边界已记录（预处理拟合只在训练侧）
        type: observation
        match: {claim: [split_defined, data_partition_recorded, leakage_boundary_recorded]}
      - id: model_or_weights
        description: 模型结构或固定权重已登记（有预测不等于本库训练过）
        type: object
        match: {kind: [model, weights]}
        # 纯评价/推理任务（已有 predictions 对象）不强求权重；训练类任务仍需要。
        unless: {type: object, match: {kind: [dataset, table, matrix],
                                       properties: {role: predictions}}}
      - id: environment_recorded
        description: 运行环境与按需硬件条件已记录（未核查保持 unknown）
        type: observation
        match: {claim: [runtime_environment_recorded, hardware_declared]}
    stage_evidence: [data_qc, splitting, training_or_inference, evaluation, explanation]
    result_checks: [leakage_boundary, eval_scope_not_training, seed_and_config_recorded]
    method_refs: []
    figure_refs: []
    knowledge_gaps: [评价通过不授予训练能力；GPU/驱动为按需声明，未核查不标可用]

  radiomics:
    version: 1
    domain: 影像组学
    label: 影像组学/影像分析
    entity_kinds: [subject, image, roi]
    object_kinds: [image, image_set, roi, mask, feature_table]
    context_fields: [modality, case_mapping, geometry, resampling, discretization, feature_params]
    prerequisites:
      - id: images
        description: 影像对象已注册（原生影像/掩膜，不强制转表）
        type: object
        match: {kind: [image, image_set]}
      - id: roi_or_features
        description: ROI/掩膜对象，或已提取的特征表（两条路线之一）
        type: object
        match: {kind: [roi, mask, feature_table]}
      - id: extraction_params
        description: 提取参数/预处理配置或已有特征来源已记录
        type: observation
        match: {claim: [extraction_config_recorded, feature_source_recorded]}
      - id: case_mapping
        description: 影像-病例对应关系已登记
        type: observation
        match: {claim: [case_mapping_recorded, design_defined]}
    stage_evidence: [segmentation, feature_extraction, feature_selection, modeling]
    result_checks: [extraction_config_recorded, feature_exists_vs_reproducible, roi_version_tracked]
    method_refs: []
    figure_refs: []
    knowledge_gaps: [特征表存在与提取可重现是不同事实；不强制重跑影像预处理]

  cadd:
    version: 1
    domain: 计算机药物设计
    label: CADD（QSAR、虚拟筛选、对接等分别声明前提）
    entity_kinds: [molecule, target]
    object_kinds: [compound_set, structure, dataset, trajectory]
    context_fields: [task_type, structure_format, preparation, docking_box, forcefield]
    prerequisites:
      - id: compounds
        description: 化合物/配体集或 SMILES 表已注册
        type: object
        match: {kind: [compound_set, structure, table], properties: {role: [ligand, compound]}}
      - id: receptor_or_training_data
        description: 受体准备文件（对接类）或训练数据（QSAR 类）之一
        type: object
        match: {kind: [structure, dataset], properties: {role: [receptor, qsar_data, training_data]}}
        # 纯配体任务（显式声明不需对接）不强求受体；未声明时保持 unknown 而非豁免。
        unless: {type: observation, match: {claim: [docking_not_required, ligand_only_declared]}}
      - id: tool_declared
        description: 外部程序/打分/准备工具已在 runtime.json 声明
        type: observation
        match: {claim: [external_tool_declared, tool_version_recorded]}
    stage_evidence: [preparation, screening_or_fitting, scoring, pose_or_prediction_review]
    result_checks: [protein_prep_version, scoring_tool_version, native_pose_objects_kept]
    method_refs: []
    figure_refs: []
    knowledge_gaps: [不把所有 CADD 任务都要求提供受体；姿态/分数保留原生对象，不只留汇总 CSV]

  network_pharmacology:
    version: 1
    domain: 网络药理毒理学
    label: 网络药理/毒理（关联、预测、待验证假设分开记）
    entity_kinds: [molecule, target, phenotype]
    object_kinds: [compound_set, target_set, network, table]
    context_fields: [database_version, species, id_mapping, dose_time]
    prerequisites:
      - id: compounds_or_exposures
        description: 化合物/暴露对象已注册
        type: object
        match: {kind: [compound_set, table, entity_set], properties: {role: [compound, exposure]}}
      - id: targets_or_phenotype
        description: 靶点集或疾病/表型实体已登记
        type: entity
        match: {kind: [target_set, phenotype, entity_set]}
      - id: database_version
        description: 数据库/标识映射版本已记录
        type: observation
        match: {claim: [database_version_recorded, id_mapping_recorded]}
    stage_evidence: [target_collection, network_construction, enrichment_or_topology, validation_candidates]
    result_checks: [recorded_vs_predicted_associations, db_version_tracked, id_mapping_species]
    method_refs: []
    figure_refs: []
    knowledge_gaps: [记录到的关联与计算预测分开；毒理任务所需剂量/时间条件按具体实现判断]

  proteomics:
    version: 1
    domain: 蛋白组学
    label: 蛋白组学（肽段/蛋白/修饰粒度显式）
    entity_kinds: [sample, peptide, protein]
    object_kinds: [ms_raw, ms_processed, matrix, feature_table]
    context_fields: [instrument, quantification, aggregation_rule, missingness, normalization]
    prerequisites:
      - id: ms_data_or_matrix
        description: 原始/处理质谱资料或丰度矩阵已注册
        type: object
        match: {kind: [ms_raw, ms_processed, matrix, feature_table],
                properties: {assay: [protein_abundance, peptide_abundance]}}
      - id: quantification_info
        description: 识别/定量处理信息与聚合规则已记录
        type: observation
        match: {claim: [quantification_recorded, aggregation_rule_recorded]}
      - id: sample_batch
        description: 样本与批次设计已登记
        type: observation
        match: {claim: [batch_recorded, design_defined]}
    stage_evidence: [identification, quantification, normalization, differential]
    result_checks: [peptide_to_protein_granularity, missingness_handling, aggregation_rule_recorded]
    method_refs: []
    figure_refs: []
    knowledge_gaps: [定量结果可用于哪些分析须单独判断；不静默套用表达矩阵假设]

  metabolomics:
    version: 1
    domain: 代谢组学
    label: 代谢组学（测得特征与已确认化合物分开）
    entity_kinds: [sample, metabolite_feature]
    object_kinds: [ms_raw, feature_table, matrix]
    context_fields: [platform, mz_rt, annotation_level, batch, normalization]
    prerequisites:
      - id: features
        description: m/z-RT 特征表或处理后矩阵已注册
        type: object
        match: {kind: [feature_table, matrix, ms_raw],
                properties: {feature_type: [mz_rt, metabolite]}}
      - id: annotation_status
        description: 注释/鉴定层级已记录（未知峰不当作已鉴定代谢物）
        type: observation
        match: {claim: [annotation_level_recorded, identification_status_recorded]}
      - id: batch_recorded
        description: 样本/批次与进样顺序信息已登记
        type: observation
        match: {claim: [batch_recorded, design_defined]}
    stage_evidence: [peak_processing, annotation, normalization, differential]
    result_checks: [measured_vs_identified, batch_correction_recorded, unknown_peaks_not_overclaimed]
    method_refs: []
    figure_refs: []
    knowledge_gaps: [峰表/注释/数据库版本变化留下依赖记录；未鉴定特征不得解释成代谢物]
