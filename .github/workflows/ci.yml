# jjd-wiki-dev CI：依赖只装在 GitHub 运行器上；local/r/compose 测试只在本机运行。
# 重步骤按 ci/ci_scope.py 的改动范围用 step 级 if 跳过；job 始终运行并上报检查（不要用 workflow 级 paths）。
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * 0"   # 每周一 02:00（北京时间）全量兜底
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 改动范围
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: python -X utf8 ci/ci_scope.py
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.frontend == 'true'
        with:
          node-version: "20"
      - name: 测试提交者身份（夹具仓库需要）
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@localhost"
      - name: 安装依赖
        run: pip install -r staged/research-wiki/requirements.lock.txt
      - name: pytest
        if: steps.scope.outputs.pytest == 'true'
        working-directory: staged/research-wiki
        run: python -X utf8 -m pytest -m "not r and not compose and not local"
      - name: 静态搜索索引测试
        if: steps.scope.outputs.frontend == 'true'
        run: python -X utf8 -m unittest discover -s frontend/search -p 'test_*.py' -v
      - name: 前端测试
        if: steps.scope.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci && npm test
      - name: 夹具 wiki init + lint
        run: |
          python -X utf8 staged/research-wiki/wiki.py --config ci/config.ci.json --wiki-root $RUNNER_TEMP/w init
          python -X utf8 staged/research-wiki/wiki.py --config ci/config.ci.json --wiki-root $RUNNER_TEMP/w lint
      - name: 推送防泄漏检查
        if: github.event_name == 'pull_request'
        run: python -X utf8 staged/research-wiki/wiki.py --config ci/config.ci.json gh guard --range origin/${{ github.base_ref }}..HEAD
